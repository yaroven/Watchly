apiVersion: batch/v1
kind: Job
metadata:
  name: watchly-migrate
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: razanka/watchly-migrator:latest
          envFrom:
            - secretRef:
                name: watchly-secrets
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
