apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Deliberately outside base: this is applied as its own step, before the app.
# The namespace comes from `kubectl -n <ns>` on the command line, not from
# here, so the same directory serves every environment:
#
#   kubectl apply -k k8s/migration -n watchly-dev
#   kubectl wait --for=condition=complete job/watchly-migrate -n watchly-dev --timeout=10m
resources:
  - job.yaml

# Must match the api tag in k8s/base/kustomization.yaml — the schema this Job
# applies has to be the one the new code expects. Bump both together.
images:
  - name: razanka/watchly-migrator
    newTag: latest
