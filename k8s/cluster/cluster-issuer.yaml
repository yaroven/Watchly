# Applied once per cluster, outside the app overlays — it is cluster-scoped
# and shared by every Ingress. The name `letsencrypt` is what the
# cert-manager.io/cluster-issuer annotation in prod/ingress.yaml refers to.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    # Let's Encrypt sends expiry warnings here. Nothing else is done with it.
    email: yaroslavve@softwareplanetgroup.com
    privateKeySecretRef:
      name: letsencrypt-account-key
    solvers:
      # HTTP-01: cert-manager plants a temporary path under /.well-known/ on
      # the same Ingress, so it needs no DNS credentials — which is exactly
      # what DuckDNS cannot give us.
      - http01:
          ingress:
            ingressClassName: nginx
