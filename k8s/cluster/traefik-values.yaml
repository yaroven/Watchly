deployment:
  replicas: 1

ingressClass:
  enabled: true
  isDefaultClass: true
  name: traefik

providers:
  kubernetesCRD:
    enabled: false
  kubernetesIngress:
    enabled: true
    publishedService:
      enabled: true

service:
  annotations:
    oci.oraclecloud.com/load-balancer-type: nlb
    oci-network-load-balancer.oraclecloud.com/security-list-management-mode: None
  spec:
    type: LoadBalancer
    externalTrafficPolicy: Cluster

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    memory: 256Mi
