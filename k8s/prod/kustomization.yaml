apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: watchly-prod

resources:
  - namespace.yaml
  - ../base
  - ingress.yaml
  - postgres.yaml
  - redis.yaml

images:
  - name: razanka/watchly-client
    newTag: prod-duckdns-1

# OCI rounds every Block Volume up to 50 GB, and Always Free covers 200 GB
# including the two 50 GB node boot volumes. That leaves room for exactly two
# PVCs, which go to postgres and redis. Logs, metrics and Grafana's own state
# live on the node's disk instead and are lost when their pod restarts;
# dashboards and datasources come from git, so those survive.
patches:
  - target:
      kind: StatefulSet
      name: loki
    patch: |-
      - op: remove
        path: /spec/volumeClaimTemplates
      - op: add
        path: /spec/template/spec/volumes/-
        value:
          name: data
          emptyDir:
            sizeLimit: 5Gi
  - target:
      kind: StatefulSet
      name: prometheus
    patch: |-
      - op: remove
        path: /spec/volumeClaimTemplates
      - op: add
        path: /spec/template/spec/volumes/-
        value:
          name: data
          emptyDir:
            sizeLimit: 5Gi
  - target:
      kind: Deployment
      name: grafana
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: grafana
      spec:
        template:
          spec:
            volumes:
              - name: data
                persistentVolumeClaim: null
                emptyDir:
                  sizeLimit: 1Gi
  - target:
      kind: PersistentVolumeClaim
      name: grafana-data
    patch: |-
      $patch: delete
      apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: grafana-data

configMapGenerator:
  - name: watchly-config
    behavior: merge
    literals:
      - REDIS_PORT=6379
      - REDIS_TLS=false
      - S3_ENDPOINT_INTERNAL=https://s3.eu-north-1.amazonaws.com
      - S3_ENDPOINT_PUBLIC=https://s3.eu-north-1.amazonaws.com
      - CORS_ALLOWED_ORIGINS=https://razanka-watchly.duckdns.org

  - name: watchly-client-config
    behavior: merge
    literals:
      - S3_IMAGE_PUBLIC_ORIGIN=https://s3.eu-north-1.amazonaws.com
      - S3_IMAGE_INTERNAL_ORIGIN=https://s3.eu-north-1.amazonaws.com
secretGenerator:
  - name: watchly-secrets
    behavior: replace
    envs:
      - .env.secrets
    options:
      disableNameSuffixHash: true
