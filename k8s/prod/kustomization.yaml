apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: watchly-prod

resources:
  - namespace.yaml
  - ../base
  - ingress.yaml

# Built separately per environment — NEXT_PUBLIC_BACKEND_API_URL and friends
# are compiled into the browser bundle, so one image cannot serve both.
images:
  - name: razanka/watchly-client
    newTag: prod-duckdns-1

patches:
  - path: replicas-patch.yaml
    target:
      kind: Deployment
      name: api

configMapGenerator:
  - name: watchly-config
    behavior: merge
    literals:
      # Managed Redis uses its own TLS port, not 6379.
      - REDIS_PORT=25061
      # Both point at the same regional endpoint on purpose. S3Service signs
      # URLs with forcePathStyle and then rewrites only the host
      # (s3.service.ts:47-53) — against real AWS that rewrite invalidates the
      # SigV4 signature, which covers the Host header. Equal values make the
      # rewrite a no-op and keep the path-style `/<bucket>/<key>` shape the
      # client's image proxy matches on.
      - S3_ENDPOINT_INTERNAL=https://s3.eu-north-1.amazonaws.com
      - S3_ENDPOINT_PUBLIC=https://s3.eu-north-1.amazonaws.com
      - CORS_ALLOWED_ORIGINS=https://razanka-watchly.duckdns.org

  - name: watchly-client-config
    behavior: merge
    literals:
      # Read at runtime by app/api/image-proxy/route.ts. Without them it falls
      # back to the LocalStack defaults (localstack:4566 / localhost:4566) and
      # every poster 400s. Same value twice for the same reason as above: there
      # is no separate in-cluster S3 to rewrite towards.
      - S3_IMAGE_PUBLIC_ORIGIN=https://s3.eu-north-1.amazonaws.com
      - S3_IMAGE_INTERNAL_ORIGIN=https://s3.eu-north-1.amazonaws.com
secretGenerator:
  # Kept inside this overlay, not in base: kustomize refuses to read files
  # above a kustomization root, and there is no --load-restrictor knob on
  # `kubectl apply -k`.
  - name: watchly-secrets
    behavior: replace
    envs:
      - .env.secrets
    options:
      disableNameSuffixHash: true
