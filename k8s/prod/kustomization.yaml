apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: watchly-prod

resources:
  - namespace.yaml
  - ../base
  - ingress.yaml
  - postgres.yaml
  - redis.yaml
  - external-secret.yaml

images:
  - name: docker.io/razanka/watchly-client
    newTag: set-by-deploy-kubernetes

patches:
  - target:
      kind: StatefulSet
      name: loki
    patch: |-
      - op: remove
        path: /spec/volumeClaimTemplates
      - op: add
        path: /spec/template/spec/volumes/-
        value:
          name: data
          emptyDir:
            sizeLimit: 5Gi
  - target:
      kind: StatefulSet
      name: prometheus
    patch: |-
      - op: remove
        path: /spec/volumeClaimTemplates
      - op: add
        path: /spec/template/spec/volumes/-
        value:
          name: data
          emptyDir:
            sizeLimit: 5Gi
  - target:
      kind: Deployment
      name: grafana
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: grafana
      spec:
        template:
          spec:
            volumes:
              - name: data
                persistentVolumeClaim: null
                emptyDir:
                  sizeLimit: 1Gi
  - target:
      kind: PersistentVolumeClaim
      name: grafana-data
    patch: |-
      $patch: delete
      apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: grafana-data

configMapGenerator:
  - name: watchly-config
    behavior: merge
    literals:
      - REDIS_PORT=6379
      - REDIS_TLS=false
      - S3_ENDPOINT_INTERNAL=https://s3.eu-north-1.amazonaws.com
      - S3_ENDPOINT_PUBLIC=https://s3.eu-north-1.amazonaws.com
      - CORS_ALLOWED_ORIGINS=https://watchly.130-61-236-83.sslip.io
      - JWT_EXPIRES_IN=1h
      - JWT_REFRESH_EXPIRES_IN=30d

  - name: watchly-client-config
    behavior: merge
    literals:
      - S3_IMAGE_PUBLIC_ORIGIN=https://s3.eu-north-1.amazonaws.com
      - S3_IMAGE_INTERNAL_ORIGIN=https://s3.eu-north-1.amazonaws.com
