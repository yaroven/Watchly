apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: watchly-secrets
spec:
  refreshInterval: 15m
  secretStoreRef:
    kind: ClusterSecretStore
    name: oci-vault
  target:
    name: watchly-secrets
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: watchly-prod-app
