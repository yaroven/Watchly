apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: watchly
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
spec:
  ingressClassName: traefik
  rules:
    - host: watchly.130-61-236-83.sslip.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: client
                port:
                  number: 4000
    - host: api.watchly.130-61-236-83.sslip.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 3000
  tls:
    - hosts:
        - watchly.130-61-236-83.sslip.io
        - api.watchly.130-61-236-83.sslip.io
      secretName: watchly-tls
