apiVersion: v1
kind: Service
metadata:
  name: client
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: client
  ports:
  - name: http
    port: 4000
    targetPort: 4000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: client
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: client
  template:
    metadata:
      labels:
        app.kubernetes.io/name: client
    spec:
      containers:
      - name: client
        image: razanka/watchly-client
        ports:
        - containerPort: 4000
        envFrom:
        # watchly-config, not watchly-client-config, would hand the browser
        # tier the api's Redis host and S3 endpoints — none of which it reads —
        # while leaving BACKEND_API_URL and S3_IMAGE_*_ORIGIN unset.
        - configMapRef:
            name: watchly-client-config
        readinessProbe:
          httpGet:
            path: /
            port: 4000
          initialDelaySeconds: 10
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /
            port: 4000
          initialDelaySeconds: 30
          periodSeconds: 20
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
