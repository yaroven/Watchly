apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: api
  ports:
  - name: http
    port: 3000
    targetPort: 3000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api
      annotations:
        # Opt-in for the scrape config in prometheus-config.yaml. The port must
        # match METRICS_PORT in the configMapGenerator below — the application
        # reads that one, Prometheus reads this one.
        prometheus.io/scrape: "true"
        prometheus.io/port: "9464"
    spec:
      containers:
      - name: api
        image: razanka/watchly-api
        ports:
        - containerPort: 3000
        envFrom:
        - configMapRef:
            name: watchly-config
        - secretRef:
            name: watchly-secrets
        # Prisma connects and migrations may run on boot, so give startup a
        # generous budget while keeping liveness tight afterwards.
        startupProbe:
          httpGet:
            path: /health
            port: 3000
          periodSeconds: 5
          failureThreshold: 24
        readinessProbe:
          httpGet:
            path: /health
            port: 3000
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: 3000
          periodSeconds: 20
        resources:
          requests:
            cpu: 200m
            memory: 256Mi
          limits:
            cpu: "1"
            memory: 1Gi
