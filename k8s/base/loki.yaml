# Named `loki` so the in-cluster DNS name matches the compose service name.
# That keeps one LOKI_URL and one Grafana datasource file working in both
# environments.
#
# No config is mounted: the image ships /etc/loki/local-config.yaml (single
# binary, filesystem storage under /loki), which is what this needs.
apiVersion: v1
kind: Service
metadata:
  name: loki
spec:
  # ClusterIP, not LoadBalancer: Loki runs with auth_enabled false, so an
  # external address would expose the push and query API to anyone.
  type: ClusterIP
  selector:
    app.kubernetes.io/name: loki
  ports:
  - name: http
    port: 3100
    targetPort: 3100
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: loki
spec:
  serviceName: loki
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: loki
  template:
    metadata:
      labels:
        app.kubernetes.io/name: loki
    spec:
      securityContext:
        fsGroup: 10001
      containers:
      - name: loki
        image: grafana/loki:3.0.0
        ports:
        - containerPort: 3100
        readinessProbe:
          httpGet:
            path: /ready
            port: 3100
          initialDelaySeconds: 15
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /ready
            port: 3100
          initialDelaySeconds: 60
          periodSeconds: 20
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: "1"
            memory: 1Gi
        args:
        - -config.file=/etc/loki/local-config.yaml
        volumeMounts:
        - name: data
          mountPath: /loki
        - name: config
          mountPath: /etc/loki
      volumes:
      - name: config
        configMap:
          name: loki-config
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      # DigitalOcean CSI block storage. It is the default class on DOKS,
      # but naming it explicitly keeps the manifest honest about where it
      # is meant to run. Volumes are network-attached, so they survive a
      # node being replaced.
      storageClassName: do-block-storage
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 10Gi
