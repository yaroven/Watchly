apiVersion: apps/v1
kind: Deployment
metadata:
  name: transcoder-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: transcoder-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: transcoder-worker
    spec:
      # ffmpeg runs for minutes per job. The 30s default would SIGKILL a
      # transcode on every rollout; BullMQ would then see the job stall and
      # burn one of its 3 attempts (see video-transcode-queue.options.ts).
      # worker-main.ts calls enableShutdownHooks, so the process does drain
      # cleanly when given the time.
      terminationGracePeriodSeconds: 600
      containers:
      - name: transcoder-worker
        image: razanka/watchly-transcoder-worker
        envFrom:
        - configMapRef:
            name: watchly-config
        - secretRef:
            name: watchly-secrets
        env:
        - name: VIDEO_TRANSCODE_CONCURRENCY
          value: "2"
        resources:
          requests:
            cpu: 500m
            memory: 512Mi
          limits:
            cpu: "2"
            memory: 2Gi
