apiVersion: apps/v1
kind: Deployment
metadata:
  name: transcoder-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: transcoder-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: transcoder-worker
    spec:
      terminationGracePeriodSeconds: 600
      containers:
      - name: transcoder-worker
        image: docker.io/razanka/watchly-transcoder-worker
        envFrom:
        - configMapRef:
            name: watchly-config
        - secretRef:
            name: watchly-secrets
        env:
        - name: VIDEO_TRANSCODE_CONCURRENCY
          value: "2"
        - name: IMAGE_TRANSCODE_CONCURRENCY
          value: "4"
        - name: REACTION_FLUSH_CONCURRENCY
          value: "8"
        resources:
          requests:
            cpu: 500m
            memory: 512Mi
          limits:
            cpu: "2"
            memory: 2Gi
