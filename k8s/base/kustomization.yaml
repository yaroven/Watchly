apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - loki-config.yaml
  - prometheus-config.yaml
  - api.yaml
  - client.yaml
  - transcoder-worker.yaml
  - loki.yaml
  - prometheus.yaml
  - grafana.yaml

labels:
  - pairs:
      app.kubernetes.io/part-of: watchly
    includeSelectors: false


images:
  - name: docker.io/razanka/watchly-api
    newTag: 9032f64-dirty
  - name: docker.io/razanka/watchly-transcoder-worker
    newTag: 9032f64-dirty

configMapGenerator:
  - name: watchly-config
    literals:
      - REDIS_TLS=true
      - LOG_LEVEL=info
      - LOKI_URL=http://loki:3100
      - FF_REACTIONS=true

  - name: watchly-client-config
    literals:
      - BACKEND_API_URL=http://api:3000

  - name: grafana-datasources
    files:
      - grafana/provisioning/datasources/loki.yml
      - grafana/provisioning/datasources/prometheus.yml
  - name: grafana-dashboards
    files:
      - grafana/provisioning/dashboards/logs.yml
      - grafana/provisioning/dashboards/application-logs.json
