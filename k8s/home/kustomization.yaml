apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: watchly-home

resources:
  - namespace.yaml
  - ../base
  - postgres.yaml
  - redis.yaml
  - minio.yaml
  - localstack.yaml
  - ingress.yaml

patches:
  - path: storage-class-patch.yaml

# Built separately per environment — NEXT_PUBLIC_BACKEND_API_URL and friends
# are compiled into the browser bundle, so the prod image cannot serve a LAN
# hostname. Build one with the home URLs and put its tag here.
images:
  - name: razanka/watchly-client
    newTag: home-550c6ba
  # The tags base pins are the ones built for DigitalOcean. This cluster runs
  # its own build — it has to, since the S3_EVENTS_ENABLED switch the overlay
  # relies on postdates them.
  - name: razanka/watchly-api
    newTag: 550c6ba
  - name: razanka/watchly-transcoder-worker
    newTag: 550c6ba

configMapGenerator:
  # The same provisioning script docker compose mounts (it reaches in here
  # from config/dev) — kustomize refuses to read files above its own root, so
  # the one copy has to live on this side.
  - name: localstack-init
    files:
      - localstack-init/provision.sh

  - name: watchly-config
    behavior: merge
    literals:
      # In-cluster Redis, plaintext on the default port — the managed-Redis
      # values in base are wrong here in both respects.
      - REDIS_PORT=6379
      - REDIS_TLS=false

      # LocalStack serves S3 and SQS from one port, which is why SQS needs
      # no separate host. s3.service.ts signs with the internal endpoint and
      # rewrites only the host afterwards; that stays valid here because the
      # emulator does not verify the Host header the way real SigV4 does.
      - S3_ENDPOINT_INTERNAL=http://localstack:4566
      - SQS_ENDPOINT=http://localstack:4566
      - S3_ENDPOINT_PUBLIC=http://s3.watchly.192-168-31-100.sslip.io
      - S3_REGION=us-east-1
      - S3_RAW_BUCKET_NAME=raw
      - S3_PROCESSED_BUCKET_NAME=content

      - CORS_ALLOWED_ORIGINS=http://watchly.192-168-31-100.sslip.io

      # Token lifetimes. Not secret, but still required in production — the
      # api hard-fails rather than falling back to the dev defaults.
      - JWT_EXPIRES_IN=1h
      - JWT_REFRESH_EXPIRES_IN=30d

  - name: watchly-client-config
    behavior: merge
    literals:
      # Read at runtime by app/api/image-proxy/route.ts: it fetches posters
      # over the internal origin and rewrites them to the public one.
      - S3_IMAGE_PUBLIC_ORIGIN=http://s3.watchly.192-168-31-100.sslip.io
      - S3_IMAGE_INTERNAL_ORIGIN=http://localstack:4566

secretGenerator:
  # Same reason as the prod overlay: kustomize will not read a file above its
  # own root, so each overlay carries its own copy.
  - name: watchly-secrets
    behavior: replace
    envs:
      - .env.secrets
    options:
      disableNameSuffixHash: true
