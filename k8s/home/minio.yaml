# S3 without AWS. MinIO speaks the same API and the same path-style URLs the
# client's image proxy matches on, so only the endpoints change.
#
# What it cannot do is the bucket-notification-into-SQS wiring: it rejects an
# AWS queue ARN. That is why the overlay sets S3_EVENTS_ENABLED=false — the
# api then schedules the transcode itself when an upload completes, and no
# queue service is needed at all.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: minio-data
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      # Raw uploads plus every HLS rendition of them. Videos are the whole
      # point of the app, so this is the claim to grow first.
      storage: 100Gi
---
apiVersion: v1
kind: Service
metadata:
  name: minio
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: minio
  ports:
    - name: s3
      port: 9000
      targetPort: 9000
    - name: console
      port: 9001
      targetPort: 9001
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: minio
  template:
    metadata:
      labels:
        app.kubernetes.io/name: minio
    spec:
      securityContext:
        fsGroup: 65532
      containers:
        - name: minio
          # MinIO's own images (Docker Hub and quay alike) stopped serving
          # anonymous pulls, so the cluster cannot fetch them. Chainguard
          # publishes a free, public build of the same server; its only
          # public tag is :latest, which is the trade for not needing a
          # registry credential here.
          image: chainguard/minio:latest
          args: ["server", "/data", "--console-address", ":9001"]
          env:
            # The api authenticates with these same two values through
            # S3_ACCESS_KEY_ID / S3_SECRET_ACCESS_KEY.
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: watchly-secrets
                  key: S3_ACCESS_KEY_ID
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: watchly-secrets
                  key: S3_SECRET_ACCESS_KEY
          ports:
            - containerPort: 9000
            - containerPort: 9001
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /minio/health/ready
              port: 9000
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 2Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: minio-data
---
# Buckets are created by LocalStack's init script in dev and by Terraform in
# prod; neither exists here, so a Job does it. `mc` is part of the same gated
# MinIO registry as the server, so this drives the S3 API with the AWS CLI
# instead — and re-running is harmless, both operations are idempotent.
apiVersion: batch/v1
kind: Job
metadata:
  name: minio-buckets
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: buckets
          image: amazon/aws-cli:latest
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              until aws --endpoint-url http://minio:9000 s3 ls >/dev/null 2>&1; do
                echo "waiting for minio..." && sleep 3
              done

              for bucket in "$S3_RAW_BUCKET_NAME" "$S3_PROCESSED_BUCKET_NAME"; do
                aws --endpoint-url http://minio:9000 s3api create-bucket --bucket "$bucket" 2>/dev/null \
                  || echo "$bucket already exists"
              done

              # The browser fetches HLS segments straight from these URLs, and
              # a presigned GET per segment would expire mid-playback.
              aws --endpoint-url http://minio:9000 s3api put-bucket-policy \
                --bucket "$S3_PROCESSED_BUCKET_NAME" \
                --policy "{\"Version\":\"2012-10-17\",\"Statement\":[{\"Effect\":\"Allow\",\"Principal\":\"*\",\"Action\":\"s3:GetObject\",\"Resource\":\"arn:aws:s3:::$S3_PROCESSED_BUCKET_NAME/*\"}]}"
          env:
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: watchly-secrets
                  key: S3_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: watchly-secrets
                  key: S3_SECRET_ACCESS_KEY
            - name: AWS_DEFAULT_REGION
              value: us-east-1
          envFrom:
            # S3_RAW_BUCKET_NAME / S3_PROCESSED_BUCKET_NAME come from here, so
            # the Job cannot drift from what the api reads.
            - configMapRef:
                name: watchly-config
