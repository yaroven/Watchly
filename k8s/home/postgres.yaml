# The managed database the prod overlay points at does not exist at home, so
# the cluster runs its own. One replica on a local-path PVC: k3s pins that
# volume to the node it was first scheduled on, which is fine for a
# single-node home server and would need a real storage class on more.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
spec:
  replicas: 1
  # The PVC is ReadWriteOnce: a rolling update would leave two pods fighting
  # over the same volume, so replace the old one first.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: watchly
            - name: POSTGRES_DB
              value: watchly
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: watchly-secrets
                  key: POSTGRES_PASSWORD
            # The image only initialises a fresh cluster when its data dir is
            # empty, and a local-path volume arrives with a lost+found in it.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "watchly", "-d", "watchly"]
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "watchly", "-d", "watchly"]
            periodSeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: postgres-data
