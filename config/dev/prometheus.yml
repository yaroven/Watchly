# Development scrape config. Not the one the cluster uses: k8s discovers pods
# through the Kubernetes API (see k8s/base/prometheus-config.yaml), which has
# no meaning under compose, so the two targets are named outright here.
#
# Lives beside the compose file rather than under volumes/, which is runtime
# scratch.
global:
  scrape_interval: 15s
  scrape_timeout: 10s

scrape_configs:
  - job_name: watchly
    static_configs:
      - targets: [api:9464]
        labels:
          service: api
      - targets: [transcoder-worker:9464]
        labels:
          service: transcoder-worker
